<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReservaLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <!-- Módulo de Autenticación -->
  <div id="auth" class="flex items-center justify-center min-h-screen px-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md space-y-6 border border-slate-200">
      <div class="text-center">
        <h1 class="text-2xl font-bold text-teal-800">ReservaLab</h1>
        <p class="text-sm text-slate-500 mt-1">Gestión de préstamos de laboratorio</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre de usuario</label>
          <input id="u" type="text" placeholder="Ej: adrica" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-600" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre completo (Para registro)</label>
          <input id="n" type="text" placeholder="Ej: Adriana Castro" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-600" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Contraseña</label>
          <input id="p" type="password" placeholder="••••••••" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-600" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Rol (Para registro)</label>
          <select id="r" class="w-full border rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-teal-600">
            <option value="ESTUDIANTE">Estudiante</option>
            <option value="SOPORTE">Soporte Técnico</option>
            <option value="ADMIN">Administrador</option>
          </select>
        </div>
      </div>

      <div class="flex gap-3 pt-2">
        <button id="login" class="flex-1 bg-teal-700 hover:bg-teal-800 text-white font-medium py-2 rounded-lg text-sm transition">Iniciar sesión</button>
        <button id="signup" class="flex-1 border border-teal-700 text-teal-700 hover:bg-teal-50 font-medium py-2 rounded-lg text-sm transition">Crear cuenta</button>
      </div>
    </div>
  </div>

  <!-- Aplicación Principal -->
  <div id="app" class="hidden min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-teal-800 text-white px-6 py-4 flex flex-wrap justify-between items-center shadow-md">
      <div class="flex items-center space-x-3">
        <span class="font-bold text-xl tracking-wide">ReservaLab</span>
        <span id="rol" class="bg-teal-900 text-teal-200 text-xs px-2.5 py-1 rounded-full font-semibold uppercase"></span>
      </div>
      <div class="flex items-center gap-4">
        <span id="who" class="text-sm font-medium"></span>
        <button id="logout" class="bg-teal-900 hover:bg-teal-950 text-xs px-3 py-1.5 rounded-lg border border-teal-700 transition">Cerrar sesión</button>
      </div>
    </header>

    <!-- Navegación -->
    <nav class="bg-white border-b border-slate-200 px-6 flex gap-6 text-sm font-medium">
      <button data-v="reservar" class="nav py-3 border-teal-700 text-teal-800">Reservar</button>
      <button data-v="calendario" class="nav py-3 text-slate-600 hover:text-teal-800">Calendario</button>
      <button data-v="mis" class="nav py-3 text-slate-600 hover:text-teal-800">Mis Reservas</button>
      <button data-v="admin" data-staff class="nav hidden py-3 text-slate-600 hover:text-teal-800">Administración</button>
      <button data-v="inventario" data-staff class="nav hidden py-3 text-slate-600 hover:text-teal-800">Inventario</button>
    </nav>

    <!-- Vista de Contenido Principal -->
    <main class="flex-1 p-6 max-w-7xl w-full mx-auto">
      <div id="view"></div>
    </main>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
